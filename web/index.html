<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive Minicrypt Clique Explorer — CS8.401 POIS Cryptographic Stack">
<title>Minicrypt Clique Explorer — CS8.401</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">M</div>
    <div><h1>Minicrypt Clique Explorer</h1><span>CS8.401 · Principles of Information Security</span></div>
  </div>
  <div class="foundation-toggle" id="foundationToggle">
    <button class="active" data-f="AES">AES-128 (PRP)</button>
    <button data-f="DLP">DLP (g<sup>x</sup> mod p)</button>
  </div>
</header>

<!-- NAV -->
<nav class="nav" id="navTabs">
  <button class="active" data-tab="explorer">🔗 Clique Explorer</button>
  <button data-tab="demos">🧪 PA Demos</button>
  <button data-tab="graph">📊 Dependency Graph</button>
</nav>

<!-- TAB: EXPLORER -->
<div class="main" id="tab-explorer">
  <!-- Column 1: Build -->
  <div class="panel">
    <div class="panel-header">
      <h2>⚡ Build Source Primitive <span class="badge">Leg 1</span></h2>
    </div>
    <div class="panel-body">
      <div class="field">
        <label>Source Primitive A</label>
        <select id="sourceSelect">
          <option value="OWF">OWF — One-Way Function</option>
          <option value="PRG">PRG — Pseudorandom Generator</option>
          <option value="PRF" selected>PRF — Pseudorandom Function</option>
          <option value="PRP">PRP — Pseudorandom Permutation</option>
          <option value="MAC">MAC — Message Auth Code</option>
          <option value="CRHF">CRHF — Collision-Resistant Hash</option>
          <option value="HMAC">HMAC</option>
        </select>
      </div>
      <div class="field">
        <label>Input Seed (hex)</label>
        <input id="seedInput" type="text" placeholder="e.g. 2b7e151628aed2a6abf7158809cf4f3c" value="2b7e151628aed2a6abf7158809cf4f3c">
      </div>
      <button class="btn btn-primary" onclick="runBuild()" style="width:100%;margin-bottom:16px">Build →</button>
      <div id="buildSteps"></div>
      <div id="buildResult"></div>
    </div>
  </div>

  <!-- Column 2: Reduce -->
  <div class="panel">
    <div class="panel-header">
      <h2>🔄 Reduce to Target <span class="badge">Leg 2</span></h2>
    </div>
    <div class="panel-body">
      <div class="field">
        <label>Target Primitive B</label>
        <select id="targetSelect">
          <option value="OWF">OWF</option>
          <option value="PRG">PRG</option>
          <option value="PRF">PRF</option>
          <option value="PRP" selected>PRP</option>
          <option value="MAC">MAC</option>
          <option value="CRHF">CRHF</option>
          <option value="HMAC">HMAC</option>
        </select>
      </div>
      <div class="field">
        <label>Query x (hex)</label>
        <input id="queryInput" type="text" placeholder="e.g. 00000000000000000000000000000001" value="00000000000000000000000000000001">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn btn-primary" onclick="runReduce()" style="flex:1">Reduce →</button>
        <button class="btn btn-ghost" onclick="swapDirection()">⇄ Swap</button>
      </div>
      <div id="reduceSteps"></div>
      <div id="reduceResult"></div>
    </div>
  </div>
</div>

<!-- Proof Summary -->
<div class="proof-panel" id="proofPanel">
  <div class="proof-header" onclick="toggleProof()">
    <span>📜 Reduction Chain & Security Proofs</span>
    <span id="proofArrow">▼</span>
  </div>
  <div class="proof-body" id="proofBody">
    <div id="proofChain" class="proof-chain"></div>
    <div id="proofItems"></div>
  </div>
</div>

<!-- TAB: DEMOS -->
<div class="main single" id="tab-demos" style="display:none">
  <div class="demo-grid" id="demoGrid"></div>
</div>

<!-- TAB: GRAPH -->
<div class="main single" id="tab-graph" style="display:none">
  <div class="panel">
    <div class="panel-header"><h2>📊 Full Dependency Graph</h2></div>
    <div class="panel-body" style="text-align:center">
      <svg id="depGraph" viewBox="0 0 900 620" style="width:100%;max-width:900px;height:auto"></svg>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">PA Demo</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const API = '';
let foundation = 'AES';

// Foundation toggle
document.querySelectorAll('#foundationToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#foundationToggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    foundation = btn.dataset.f;
  });
});

// Tab navigation
document.querySelectorAll('.nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.main').forEach(t => t.style.display = 'none');
    document.getElementById('proofPanel').style.display = btn.dataset.tab === 'explorer' ? '' : 'none';
    const el = document.getElementById('tab-' + btn.dataset.tab);
    if (el) el.style.display = '';
  });
});

function renderSteps(container, steps) {
  container.innerHTML = steps.map((s, i) =>
    `<div class="step" style="animation-delay:${i*0.1}s">
      <div><div class="fn">${s.fn}</div>
      <div class="vals">In: ${s.input}<br>Out: <span>${s.output}</span></div></div>
    </div>${i < steps.length-1 ? '<div class="step-arrow">↓</div>' : ''}`
  ).join('');
}

async function runBuild() {
  const el = document.getElementById('buildSteps');
  const res = document.getElementById('buildResult');
  el.innerHTML = '<div class="spinner"></div>';
  res.innerHTML = '';
  try {
    const r = await fetch(API + '/api/build', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({foundation, source: document.getElementById('sourceSelect').value, seed: document.getElementById('seedInput').value})
    });
    const data = await r.json();
    if (data.detail) { el.innerHTML = `<div style="color:var(--red)">${data.detail}</div>`; return; }
    renderSteps(el, data.steps);
    res.innerHTML = `<div class="result"><div class="label">${data.source} Output (${data.foundation})</div><div class="value">${data.result}</div></div>`;
  } catch(e) { el.innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`; }
}

async function runReduce() {
  const el = document.getElementById('reduceSteps');
  const res = document.getElementById('reduceResult');
  el.innerHTML = '<div class="spinner"></div>';
  res.innerHTML = '';
  try {
    const r = await fetch(API + '/api/reduce', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({foundation, source: document.getElementById('sourceSelect').value, target: document.getElementById('targetSelect').value, seed: document.getElementById('seedInput').value, query: document.getElementById('queryInput').value})
    });
    const data = await r.json();
    if (data.error) { el.innerHTML = `<div style="color:var(--amber);padding:12px;background:var(--bg);border-radius:8px">⚠️ ${data.error}</div>`; return; }
    if (data.detail) { el.innerHTML = `<div style="color:var(--red)">${data.detail}</div>`; return; }
    renderSteps(el, data.steps);
    res.innerHTML = `<div class="result"><div class="label">Final Output</div><div class="value">${data.output}</div></div>`;
    // Proof panel
    const chain = document.getElementById('proofChain');
    const items = document.getElementById('proofItems');
    const src = document.getElementById('sourceSelect').value;
    const tgt = document.getElementById('targetSelect').value;
    chain.innerHTML = `<div class="proof-node">${foundation}</div><div class="proof-edge">→</div><div class="proof-node">${src}</div><div class="proof-edge">→</div><div class="proof-node">${tgt}</div>`;
    items.innerHTML = (data.proofs||[]).map(p => `<div class="proof-item"><div class="theorem">${p.theorem||p.step}</div><div class="security">${p.security||p.description}</div><div class="pa-badge">${p.pa||''}</div></div>`).join('');
  } catch(e) { el.innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`; }
}

function swapDirection() {
  const s = document.getElementById('sourceSelect');
  const t = document.getElementById('targetSelect');
  [s.value, t.value] = [t.value, s.value];
}

function toggleProof() {
  document.getElementById('proofBody').classList.toggle('open');
  document.getElementById('proofArrow').textContent = document.getElementById('proofBody').classList.contains('open') ? '▲' : '▼';
}

// ── PA Demo Cards ──
const PAS = [
  {pa:1,title:"OWF & PRG",desc:"DLP/AES OWFs, HILL PRG construction",phase:1},
  {pa:2,title:"PRF (GGM Tree)",desc:"GGM tree PRF, distinguishing game",phase:1},
  {pa:3,title:"CPA-Secure Encryption",desc:"Randomized encryption, IND-CPA game",phase:2},
  {pa:4,title:"Modes of Operation",desc:"CBC, OFB, CTR modes with attack demos",phase:2},
  {pa:5,title:"MACs",desc:"PRF-MAC, CBC-MAC, EUF-CMA game",phase:2},
  {pa:6,title:"CCA-Secure Encryption",desc:"Encrypt-then-MAC, malleability demo",phase:2},
  {pa:7,title:"Merkle-Damgård",desc:"Generic hash framework with trace",phase:3},
  {pa:8,title:"DLP-CRHF",desc:"g^x·h^y mod p hash function",phase:3},
  {pa:9,title:"Birthday Attack",desc:"Collision finding on toy hashes",phase:3},
  {pa:10,title:"HMAC",desc:"HMAC, Encrypt-then-HMAC, timing demo",phase:3},
  {pa:11,title:"Diffie-Hellman",desc:"Key exchange, MITM attack",phase:4},
  {pa:12,title:"RSA",desc:"Textbook RSA, PKCS#1 v1.5, Bleichenbacher",phase:4},
  {pa:13,title:"Miller-Rabin",desc:"Primality testing, prime generation",phase:4},
  {pa:14,title:"CRT & Håstad",desc:"CRT, RSA CRT speedup, broadcast attack",phase:4},
  {pa:15,title:"Digital Signatures",desc:"RSA signatures, homomorphism attack",phase:4},
  {pa:16,title:"ElGamal",desc:"PKC, malleability attack",phase:4},
  {pa:17,title:"CCA-Secure PKC",desc:"Encrypt-then-Sign, IND-CCA2",phase:5},
  {pa:18,title:"Oblivious Transfer",desc:"1-out-of-2 OT (Bellare-Micali)",phase:5},
  {pa:19,title:"Secure AND",desc:"AND/XOR/NOT gates via OT",phase:5},
  {pa:20,title:"2-Party MPC",desc:"Circuits: comparator, equality, adder",phase:5},
];
const phaseClass = {1:'pa-phase1',2:'pa-phase2',3:'pa-phase3',4:'pa-phase4',5:'pa-phase5'};
const phaseNames = {1:'Foundation',2:'Symmetric',3:'Hashing',4:'Public-Key',5:'MPC'};

function renderDemos() {
  document.getElementById('demoGrid').innerHTML = PAS.map(p =>
    `<div class="demo-card ${phaseClass[p.phase]}" onclick="runPADemo(${p.pa})">
      <div class="card-header"><h3>${p.title}</h3><span class="pa-num">PA#${p.pa}</span></div>
      <div class="card-body">${p.desc}<br><small style="color:var(--text3)">Phase ${p.phase}: ${phaseNames[p.phase]}</small></div>
    </div>`
  ).join('');
}
renderDemos();

async function runPADemo(pa) {
  const info = PAS.find(p => p.pa === pa);
  document.getElementById('modalTitle').textContent = `PA#${pa} — ${info.title}`;
  document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:40px"><div class="spinner"></div><p style="margin-top:12px;color:var(--text2)">Running demo...</p></div>';
  document.getElementById('modal').classList.add('open');
  try {
    const r = await fetch(API + '/api/demo', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({pa, params: {}})
    });
    const data = await r.json();
    if (data.detail) { document.getElementById('modalBody').innerHTML = `<pre style="color:var(--red)">${data.detail}</pre>`; return; }
    document.getElementById('modalBody').innerHTML = renderDemoResult(pa, data);
  } catch(e) {
    document.getElementById('modalBody').innerHTML = `<pre style="color:var(--red)">Error: ${e.message}</pre>`;
  }
}

function renderDemoResult(pa, data) {
  function kvRow(k, v) {
    const cls = v === true ? 'tag-true' : v === false ? 'tag-false' : '';
    const display = typeof v === 'boolean' ? (v ? '✓ True' : '✗ False') : String(v);
    return `<div class="kv"><span class="k">${k}</span><span class="v ${cls}">${display}</span></div>`;
  }
  function section(title, obj) {
    let html = `<h3 style="font-size:14px;font-weight:600;margin:16px 0 8px;color:var(--accent3)">${title}</h3>`;
    if (typeof obj === 'object' && obj !== null) {
      for (const [k, v] of Object.entries(obj)) {
        if (typeof v === 'object' && v !== null && !Array.isArray(v)) {
          html += section(k, v);
        } else if (Array.isArray(v)) {
          html += kvRow(k, JSON.stringify(v));
        } else {
          html += kvRow(k, v);
        }
      }
    } else {
      html += `<pre>${JSON.stringify(obj, null, 2)}</pre>`;
    }
    return html;
  }
  let html = '';
  for (const [k, v] of Object.entries(data)) {
    if (typeof v === 'object' && v !== null && !Array.isArray(v)) {
      html += section(k, v);
    } else {
      html += kvRow(k, v);
    }
  }
  return html;
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ── Dependency Graph SVG ──
function renderGraph() {
  const nodes = [
    {id:'AES',x:100,y:50,c:'#6366f1'},{id:'PA#1\nOWF/PRG',x:100,y:150,c:'#6366f1'},
    {id:'PA#2\nPRF/GGM',x:100,y:250,c:'#6366f1'},{id:'PA#13\nMiller-Rabin',x:450,y:50,c:'#22c55e'},
    {id:'PA#3\nCPA-Enc',x:250,y:350,c:'#06b6d4'},{id:'PA#4\nModes',x:50,y:350,c:'#06b6d4'},
    {id:'PA#5\nMAC',x:250,y:250,c:'#06b6d4'},{id:'PA#6\nCCA-Enc',x:250,y:450,c:'#06b6d4'},
    {id:'PA#7\nMerkle-Damgård',x:450,y:250,c:'#f59e0b'},{id:'PA#8\nDLP-CRHF',x:450,y:350,c:'#f59e0b'},
    {id:'PA#9\nBirthday',x:600,y:350,c:'#f59e0b'},{id:'PA#10\nHMAC',x:450,y:450,c:'#f59e0b'},
    {id:'PA#11\nDH',x:600,y:150,c:'#22c55e'},{id:'PA#12\nRSA',x:750,y:150,c:'#22c55e'},
    {id:'PA#14\nCRT',x:750,y:250,c:'#22c55e'},{id:'PA#15\nSignatures',x:750,y:350,c:'#22c55e'},
    {id:'PA#16\nElGamal',x:600,y:250,c:'#22c55e'},{id:'PA#17\nCCA-PKC',x:700,y:450,c:'#ef4444'},
    {id:'PA#18\nOT',x:600,y:450,c:'#ef4444'},{id:'PA#19\nSecure AND',x:600,y:530,c:'#ef4444'},
    {id:'PA#20\nMPC',x:750,y:530,c:'#ef4444'},
  ];
  const edges = [
    ['AES','PA#1\nOWF/PRG'],['PA#1\nOWF/PRG','PA#2\nPRF/GGM'],['AES','PA#2\nPRF/GGM'],
    ['PA#2\nPRF/GGM','PA#3\nCPA-Enc'],['AES','PA#4\nModes'],['PA#2\nPRF/GGM','PA#5\nMAC'],
    ['PA#3\nCPA-Enc','PA#6\nCCA-Enc'],['PA#5\nMAC','PA#6\nCCA-Enc'],
    ['PA#7\nMerkle-Damgård','PA#8\nDLP-CRHF'],['PA#13\nMiller-Rabin','PA#8\nDLP-CRHF'],
    ['PA#8\nDLP-CRHF','PA#10\nHMAC'],['PA#3\nCPA-Enc','PA#10\nHMAC'],
    ['PA#13\nMiller-Rabin','PA#11\nDH'],['PA#13\nMiller-Rabin','PA#12\nRSA'],
    ['PA#12\nRSA','PA#14\nCRT'],['PA#12\nRSA','PA#15\nSignatures'],['PA#8\nDLP-CRHF','PA#15\nSignatures'],
    ['PA#11\nDH','PA#16\nElGamal'],['PA#16\nElGamal','PA#17\nCCA-PKC'],['PA#15\nSignatures','PA#17\nCCA-PKC'],
    ['PA#16\nElGamal','PA#18\nOT'],['PA#18\nOT','PA#19\nSecure AND'],['PA#19\nSecure AND','PA#20\nMPC'],
  ];
  const svg = document.getElementById('depGraph');
  let html = '<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker></defs>';
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);
  edges.forEach(([from, to]) => {
    const a = nodeMap[from], b = nodeMap[to];
    if (a && b) html += `<line x1="${a.x+50}" y1="${a.y+20}" x2="${b.x+50}" y2="${b.y}" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead)"/>`;
  });
  nodes.forEach(n => {
    const lines = n.id.split('\n');
    html += `<rect x="${n.x}" y="${n.y}" width="100" height="${lines.length > 1 ? 40 : 30}" rx="8" fill="${n.c}22" stroke="${n.c}" stroke-width="1.5"/>`;
    lines.forEach((line, i) => {
      html += `<text x="${n.x+50}" y="${n.y + 14 + i*16}" text-anchor="middle" fill="${n.c}" font-size="11" font-weight="600" font-family="Inter,sans-serif">${line}</text>`;
    });
  });
  svg.innerHTML = html;
}
renderGraph();
</script>
<script src="/static/demo_ui.js"></script>
</body>
</html>
